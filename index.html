<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Deaths in Police Custody or during Police Intervention in Spain</title>

<style>

:root {
  --paper: #f7f6f1;
  --ink: #111;
  --muted: #777;
  --line: #ddd;
  --card: #fff;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
}


/* =========================================
   INTRO
========================================= */

header {
  padding: 32px 5vw 25px;
  border-bottom: 1px solid var(--line);

  display: grid;
  grid-template-columns: minmax(260px, 1fr) minmax(300px, 480px);
  column-gap: 7vw;
  align-items: end;
}

.kicker {
  grid-column: 1 / -1;

  margin-bottom: 18px;

  font: 10px Arial, sans-serif;
  text-transform: uppercase;
  letter-spacing: .16em;
  color: var(--muted);
}

h1 {
  max-width: 650px;

  margin: 0;

  font-size: clamp(44px, 5.5vw, 75px);
  line-height: .88;
  font-weight: normal;
  letter-spacing: -.055em;
}

.intro {
  max-width: 480px;

  font-size: 14px;
  line-height: 1.45;
  color: #333;
}

.intro p {
  margin: 0 0 8px;
}

.intro p:last-child {
  margin-bottom: 0;
}

.scroll-note {
  grid-column: 1 / -1;

  margin-top: 20px;

  font: 10px Arial, sans-serif;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--muted);
}


/* =========================================
   CONTROLS
========================================= */

.controls {
  position: sticky;
  top: 0;
  z-index: 100;

  display: flex;
  gap: 7px;
  flex-wrap: wrap;

  padding: 9px 5vw;

  background: rgba(247,246,241,.94);
  backdrop-filter: blur(10px);

  border-bottom: 1px solid var(--line);
}

input,
select,
button {
  font: inherit;
}

input,
select {
  padding: 8px 10px;

  border: 1px solid #bbb;
  background: rgba(255,255,255,.25);
}

input {
  width: 250px;
}

.control {
  padding: 8px 11px;

  border: 1px solid #bbb;
  background: transparent;

  cursor: pointer;
}

.control:hover {
  background: var(--ink);
  color: white;
}

#count {
  margin-left: auto;
  align-self: center;

  font: 10px Arial, sans-serif;
  color: var(--muted);
}


/* =========================================
   ARCHIVE FIELD
========================================= */

#map {
  position: relative;

  /*
    The archive is still scrollable,
    but much more compact than before.
  */
  height: 1800px;

  overflow: hidden;

  border-bottom: 1px solid var(--line);

  background:
    linear-gradient(
      rgba(0,0,0,.035) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(0,0,0,.035) 1px,
      transparent 1px
    );

  background-size: 80px 80px;
}


/* subtle archive marker */

#map::before {
  content: "ARCHIVE";

  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  font: 10px Arial, sans-serif;
  letter-spacing: .2em;

  color: #d0d0d0;

  pointer-events: none;
}


/* =========================================
   NAMES
========================================= */

.case {
  position: absolute;

  border: 0;
  padding: 0;

  background: transparent;
  color: var(--ink);

  text-align: left;

  cursor: grab;

  user-select: none;
  touch-action: none;

  transition:
    opacity .25s ease,
    transform .12s ease;
}

.case:active {
  cursor: grabbing;
  z-index: 1000;
}

.case:hover {
  z-index: 100;
}

.name {
  display: block;

  font-size: clamp(18px, 2vw, 29px);
  line-height: 1;

  white-space: nowrap;

  border-bottom: 1px solid transparent;
}

.case:hover .name {
  border-bottom-color: var(--ink);
}

.date,
.type {
  display: block;

  margin-top: 5px;

  font: 9px Arial, sans-serif;

  text-transform: uppercase;
  letter-spacing: .07em;

  color: var(--muted);
}


/* =========================================
   HIDDEN
========================================= */

.case.hidden {
  opacity: 0;
  pointer-events: none;
}


/* =========================================
   EMPTY
========================================= */

#empty {
  display: none;

  padding: 100px 20px;

  text-align: center;

  font: 12px Arial, sans-serif;
  color: var(--muted);
}


/* =========================================
   MODAL
========================================= */

dialog {
  width: min(650px, 92vw);
  max-height: 88vh;

  padding: 0;

  border: 1px solid var(--ink);

  background: var(--card);

  box-shadow: 12px 12px 0 rgba(0,0,0,.08);
}

dialog::backdrop {
  background: rgba(0,0,0,.4);
}

.card {
  padding: 40px;
}

.card h2 {
  margin: 0 0 8px;

  font-size: clamp(32px, 5vw, 55px);
  line-height: .95;
  font-weight: normal;
}

.meta {
  font: 11px Arial, sans-serif;
  text-transform: uppercase;
  color: var(--muted);
}

.description {
  margin: 25px 0;

  font-size: 17px;
  line-height: 1.6;
}

.card a {
  display: block;

  margin-top: 10px;

  color: var(--ink);

  font: 12px Arial, sans-serif;

  overflow-wrap: anywhere;
}

.close {
  position: absolute;

  right: 12px;
  top: 8px;

  border: 0;
  background: transparent;

  font-size: 28px;

  color: var(--muted);

  cursor: pointer;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

  header {
    display: block;

    padding: 25px 20px 20px;
  }

  .kicker {
    margin-bottom: 15px;
  }

  h1 {
    font-size: 46px;
    margin-bottom: 20px;
  }

  .intro {
    font-size: 14px;
  }

  .scroll-note {
    margin-top: 18px;
  }

  .controls {
    padding: 8px 12px;
  }

  input {
    width: 100%;
  }

  #count {
    width: 100%;
    margin-left: 0;
  }

  #map {
    height: 1800px;
    background-size: 60px 60px;
  }

  .name {
    font-size: 18px;
  }

  .card {
    padding: 28px;
  }

}

</style>
</head>


<body>


<!-- =========================================
     INTRO
========================================= -->

<header>

  <div class="kicker">
    Interactive archive · Spain
  </div>

  <h1>
    Deaths under<br>
    police custody
  </h1>

  <div class="intro">

    <p>
      An archive of deaths linked to police violence,
      detention or confinement in Spain.
    </p>

    <p>
      The cases are not arranged chronologically.
      Move the names and explore each case.
    </p>

  </div>

  <div class="scroll-note">
    Scroll · drag names · click a name
  </div>

</header>


<!-- =========================================
     CONTROLS
========================================= -->

<div class="controls">

  <input
    id="search"
    type="search"
    placeholder="Search name, place or year"
    aria-label="Search"
  >

  <select
    id="filter"
    aria-label="Filter by category"
  >

    <option value="">
      All categories
    </option>

  </select>

  <button
    class="control"
    id="reset"
    type="button"
  >
    Reset positions
  </button>

  <div id="count"></div>

</div>


<!-- =========================================
     NAME FIELD
========================================= -->

<main id="map"></main>


<div id="empty">
  No cases match your search.
</div>


<!-- =========================================
     CASE INFORMATION
========================================= -->

<dialog id="dialog">

  <button
    class="close"
    type="button"
    aria-label="Close"
  >
    ×
  </button>

  <div
    class="card"
    id="card"
  ></div>

</dialog>


<script src="data.js"></script>

<script>

/* =========================================
   ELEMENTS
========================================= */

const map =
  document.getElementById("map");

const search =
  document.getElementById("search");

const filter =
  document.getElementById("filter");

const reset =
  document.getElementById("reset");

const count =
  document.getElementById("count");

const empty =
  document.getElementById("empty");

const dialog =
  document.getElementById("dialog");

const card =
  document.getElementById("card");


/* =========================================
   STORAGE
========================================= */

const STORAGE =
  "police-deaths-map-positions";


let saved = {};

try {

  saved =
    JSON.parse(
      localStorage.getItem(STORAGE)
    ) || {};

} catch {

  saved = {};

}


/* =========================================
   ITEMS
========================================= */

const items = [];


/* =========================================
   HELPERS
========================================= */

function clean(value) {

  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();

}


function dateText(date) {

  if (!date) return "";

  if (date.length === 4) {
    return date;
  }

  const parts =
    date.split("-");

  if (parts.length !== 3) {
    return date;
  }

  const d =
    new Date(
      Date.UTC(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
      )
    );

  return d.toLocaleDateString(
    "en-GB",
    {
      day: "numeric",
      month: "long",
      year: "numeric",
      timeZone: "UTC"
    }
  );

}


/* =========================================
   INITIAL NAME POSITIONS
========================================= */

function randomPosition() {

  /*
    Names begin near the top of the archive.

    They are spread across a field rather
    than forming one tight pile.
  */

  const paddingX = 60;

  const fieldWidth =
    map.clientWidth - 120;

  const fieldHeight =
    900;


  const x =
    paddingX +
    Math.random() *
    fieldWidth;


  const y =
    50 +
    Math.random() *
    fieldHeight;


  return {

    x: Math.max(
      40,
      Math.min(
        map.clientWidth - 350,
        x
      )
    ),

    y: Math.max(
      40,
      Math.min(
        map.clientHeight - 180,
        y
      )
    )

  };

}


/* =========================================
   CREATE NAMES
========================================= */

CASOS.forEach(caso => {

  const button =
    document.createElement("button");

  button.type = "button";

  button.className = "case";


  button.innerHTML = `

    <span class="name">
      ${caso.nombre}
    </span>

    <span class="date">
      ${dateText(caso.fecha)}
    </span>

    <span class="type">
      ${TIPOS[caso.tipo] || "No information"}
    </span>

  `;


  map.appendChild(button);


  /*
    Use saved position if available.
    Otherwise generate a new position.
  */

  const position =
    saved[caso.id] ||
    randomPosition();


  const item = {

    caso,

    button,

    x: position.x,

    y: position.y,

    dragging: false,

    moved: false

  };


  items.push(item);

  render(item);


  /* =====================================
     DRAG START
  ===================================== */

  button.addEventListener(
    "pointerdown",
    event => {

      if (event.button !== 0) {
        return;
      }

      item.dragging = true;
      item.moved = false;

      const rect =
        map.getBoundingClientRect();


      item.offsetX =
        event.clientX -
        rect.left -
        item.x;


      item.offsetY =
        event.clientY -
        rect.top -
        item.y;


      button.setPointerCapture(
        event.pointerId
      );


      button.style.zIndex =
        "1000";

    }
  );


  /* =====================================
     DRAGGING
  ===================================== */

  button.addEventListener(
    "pointermove",
    event => {

      if (!item.dragging) {
        return;
      }


      item.moved = true;


      const rect =
        map.getBoundingClientRect();


      item.x =
        event.clientX -
        rect.left -
        item.offsetX;


      item.y =
        event.clientY -
        rect.top -
        item.offsetY;


      item.x =
        Math.max(
          0,
          Math.min(
            item.x,
            map.clientWidth -
            button.offsetWidth
          )
        );


      item.y =
        Math.max(
          0,
          Math.min(
            item.y,
            map.clientHeight -
            button.offsetHeight
          )
        );


      render(item);

    }
  );


  /* =====================================
     DRAG END / CLICK
  ===================================== */

  button.addEventListener(
    "pointerup",
    event => {

      if (!item.dragging) {
        return;
      }


      item.dragging = false;

      button.style.zIndex = "";


      try {

        button.releasePointerCapture(
          event.pointerId
        );

      } catch {}


      save();


      /*
        If the pointer didn't move,
        treat it as a click.
      */

      if (!item.moved) {
        openCase(caso);
      }

    }
  );


  button.addEventListener(
    "pointercancel",
    () => {

      item.dragging = false;

      button.style.zIndex = "";

    }
  );

});


/* =========================================
   RENDER
========================================= */

function render(item) {

  item.button.style.left =
    item.x + "px";

  item.button.style.top =
    item.y + "px";

}


/* =========================================
   SAVE POSITIONS
========================================= */

function save() {

  const positions = {};


  items.forEach(item => {

    positions[item.caso.id] = {

      x: item.x,
      y: item.y

    };

  });


  localStorage.setItem(
    STORAGE,
    JSON.stringify(positions)
  );

}


/* =========================================
   RESET POSITIONS
========================================= */

reset.addEventListener(
  "click",
  () => {

    localStorage.removeItem(
      STORAGE
    );


    items.forEach(item => {

      const position =
        randomPosition();


      item.x =
        position.x;

      item.y =
        position.y;


      render(item);

    });


    save();

  }
);


/* =========================================
   FILTER OPTIONS
========================================= */

Object.entries(TIPOS).forEach(
  ([key, label]) => {

    const option =
      document.createElement("option");


    option.value =
      key;


    option.textContent =
      label;


    filter.appendChild(option);

  }
);


/* =========================================
   SEARCH / FILTER
========================================= */

function update() {

  const query =
    clean(search.value);

  const selected =
    filter.value;

  let visible = 0;


  items.forEach(item => {

    const c =
      item.caso;


    const searchable =
      clean([
        c.nombre,
        c.lugar,
        c.fecha,
        c.causa,
        c.texto,
        TIPOS[c.tipo]
      ].join(" "));


    const matchesSearch =
      !query ||
      searchable.includes(query);


    const matchesType =
      !selected ||
      c.tipo === selected;


    const show =
      matchesSearch &&
      matchesType;


    item.button.classList.toggle(
      "hidden",
      !show
    );


    if (show) {
      visible++;
    }

  });


  count.textContent =
    `${visible} of ${items.length} cases`;


  empty.style.display =
    visible === 0
      ? "block"
      : "none";

}


search.addEventListener(
  "input",
  update
);

filter.addEventListener(
  "change",
  update
);


/* =========================================
   OPEN CASE
========================================= */

function openCase(caso) {

  const sources =
    Array.isArray(caso.fuentes)
      ? caso.fuentes
      : [];


  card.innerHTML = `

    <h2>
      ${caso.nombre}
    </h2>

    <div class="meta">
      ${dateText(caso.fecha)}
      ·
      ${caso.lugar || ""}
    </div>

    <div class="description">
      ${
        caso.texto ||
        caso.causa ||
        "No information available."
      }
    </div>

    ${
      sources.map(url => `
        <a
          href="${url}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ${url}
        </a>
      `).join("")
    }

  `;


  dialog.showModal();

}


/* =========================================
   CLOSE
========================================= */

document
  .querySelector(".close")
  .addEventListener(
    "click",
    () => dialog.close()
  );


dialog.addEventListener(
  "click",
  event => {

    if (
      event.target === dialog
    ) {

      dialog.close();

    }

  }
);


/* =========================================
   START
========================================= */

update();

</script>

</body>
</html>
